name: ROF_AntiVPN
version: '${project.version}'
main: me.rageoffire.rofantivpn.ROFAntiVPN
api-version: '1.20'
description: Detect players using VPN/Proxy with fallback APIs, caching, and proxy server support.
author: RageOfFire
website: https://github.com/RageOfFire/ROF_AntiVPN

softdepend:
  - PlaceholderAPI

commands:
  rofvpn:
    description: Main ROF_AntiVPN command
    usage: /rofvpn <reload|setapikey|check|cache>
    aliases: [vpn]

permissions:
  rofvpn.admin:
    description: Access to reload, setapikey, cache commands
    default: op
  rofvpn.check:
    description: Manually check a player's IP
    default: op
  rofvpn.bypass:
    description: Bypass VPN check
    default: false
  rofvpn.alert:
    description: Receive alerts when a player is detected using VPN/Proxy
    default: op
